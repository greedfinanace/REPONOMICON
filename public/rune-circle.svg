<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="95" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="80" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="65" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Rune symbols around the circle -->
  <g fill="currentColor" opacity="0.6" font-family="monospace" font-size="8">
    <text x="100" y="15" text-anchor="middle">⍙</text>
    <text x="170" y="55" text-anchor="middle">⊏</text>
    <text x="190" y="105" text-anchor="middle">⏃</text>
    <text x="170" y="155" text-anchor="middle">⏁</text>
    <text x="100" y="195" text-anchor="middle">⟟</text>
    <text x="30" y="155" text-anchor="middle">⌇</text>
    <text x="10" y="105" text-anchor="middle">⎅</text>
    <text x="30" y="55" text-anchor="middle">⟒</text>
  </g>
  
  <!-- Inner pentagram-like shape -->
  <polygon points="100,25 145,85 130,150 70,150 55,85" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.3"/>
  
  <!-- Center eye -->
  <ellipse cx="100" cy="100" rx="15" ry="20" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.5"/>
  <circle cx="100" cy="100" r="5" fill="currentColor" opacity="0.4"/>
</svg>
